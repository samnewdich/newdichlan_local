<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newdich Technology - Sell Starlink Internet</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">NEWDICH LAN</div>
            <ul class="nav-links">
                <li><a href="#packages">Packages</a></li>
                <li><a href="#signup">Become a Merchant</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="container">
                <span id="output"></span>
                <h1>Sell Starlink / FibreOne Internet to Your Community</h1>
                <p>Start your own internet business with our ready‑to‑use platform.</p>
                <a href="#signup" class="btn btn-primary">Get Started</a>
            </div>
        </section>

        <!-- Packages Section -->
        <section id="packages" class="packages">
            <div class="container">
                <h2>Our Service Packages</h2>
                <div class="package-grid" id="package-list">
                    <!-- Packages will be loaded here via JS -->
                </div>
            </div>
        </section>

        <!-- Merchant Signup Form -->
        <section id="signup" class="signup">
            <div class="container">
                <h2>Become a Merchant</h2>
                <form id="merchant-form">
                    <div class="form-group">
                        <label for="fullname">Full Name *</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Password *</label>
                        <input type="text" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="business_name">Business Name</label>
                        <input type="text" id="business_name" name="business_name">
                    </div>
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="state">State *</label>
                            <input type="text" id="state" name="state" required>
                        </div>
                        <div class="form-group">
                            <label for="country">Country *</label>
                            <input type="text" id="country" name="country" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="refer_code">Referral Code (optional)</label>
                        <input type="text" id="refer_by" name="refer_by">
                    </div>
                    <div class="form-group">
                        <label for="refer_code">Account Type</label>
                        <select name="account_type" id="account_type">
                            <option>Choose One</option>
                            <option value="Basic">Basic</option>
                            <option value="Premium">Premium</option>
                        </select>
                    </div>
                    
                    <input type="hidden" name="date_created" id="date_created">
                    <button type="submit" class="btn btn-primary" onclick="registerMarchant()">Register</button>
                    <div id="form-message" class="message"></div>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Powered by NEWDICH TECHNOLOGY</p>
            <p>&copy; <span id="year"></span> Newdich Technology. All rights reserved.</p>
        </div>
    </footer>

    <script>
    dateCreated();
    
        async function registerMarchant(){
            event.preventDefault();
            let merchant_form = document.getElementById("merchant-form");
            let formdata = new FormData(merchant_form);
            
            let api = await fetch('/api/registermarchant', {
                method:"POST",
                body:formdata
            });
            
            let res = await api.json();
            if(res.status ==="success"){
                localStorage.setItem("regsuccess", "Registration was successful");
                document.getElementById("output").innerHTML=`<div style="align:center; color:green; font-size:14px; font-weight:bold;">${res.response} <br/> <button onclick="logi()">Login</button></div>`;
                logi();
                return;
            }
            else{
                document.getElementById("output").innerHTML=`<div style="align:center; color:red; font-size:14px; font-weight:bold;">${res.response}</div>`;
                return;
            }
        }
        
        
        function dateCreated(){
            document.getElementById("date_created").value=Math.floor(Date.now()/1000);
        }
        
        
        function logi(){
            window.location.href="/marchant";
        }
    </script>
</body>
</html>
