<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect to Network</title>
    <link rel="stylesheet" href="/newdichlan/ansofra/public/marchant/css/style.css">
</head>
<body>
    <header class="portal-header">
        <div class="container">
            <h1>Welcome to <span id="network-name">Newdich LAN</span></h1>
            <p>Choose a plan to get online</p>
        </div>
    </header>

    <main class="portal-main">
        <div class="container">
            <div class="plan-grid" id="plan-list">
                <!-- Plans will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Payment Modal (simplified) -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Complete Payment</h3>
            <p>Plan: <span id="modal-plan-name"></span></p>
            <p>Amount: NGN <span id="modal-plan-price"></span></p>
            <form id="payment-form">
                <div class="form-group">
                    <label for="payment-email">Email (optional)</label>
                    <input type="email" id="payment-email" placeholder="Enter your email for receipt">
                </div>
                <button type="submit" class="btn btn-primary">Pay Now</button>
            </form>
            <div id="payment-message"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Powered by NEWDICH TECHNOLOGY</p>
            <p>&copy; <span id="year"></span> Newdich Technology</p>
        </div>
    </footer>

    <script>
        plans();
        
        async function plans() {
            let api = await fetch('http://192.168.200.1:8080/newdichlan/ansofra/api/getplans', {
                method:"POST",
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify()
            });

            let res = await api.json();
            if(res.status ==="success"){
                let output = `<form id="pay_form"><select name="plans_id">`;
                let response = res.response;
                for(let i=0; i < response.length; i++){
                    output +=`
                        <option value="${response[i].plans_id}">${response[i].plan} - ${response[i].currency} ${response[i].price}</option>
                    `;
                }

                output +=`</select>`;
                output +=`
                    <button id="paybtn" class="btn btn-secondary" onclick="pay()">Pay</button>
                    <div id="screen"></div>
                    </form>
                `;
            }
            else{
                alert(`${res.response}`);
            }
        }




        async function pay(){
            event.preventDefault();
            const params = Object.fromEntries(new URL(window.location.href).searchParams.entries());
            let mac = params.mac;
            let ip = params.ip;
            let device = params.device;
            let current_time = params.current_time;
            let date_created = current_time;

            let plans_id = document.getElementById("plans_id").value;

            let body = {
                mac : mac,
                last_ip : ip,
                device_name : device,
                date_created : date_created,
                current_time : current_time,
                phone : ""
            }

            //firstly check if he has data stored on his browser before
            let devicedata = localStorage.getItem("devicedata");
            if(devicedata || devicedata !=='' || devicedata !==null || devicedata !==undefined){
                let profile = JSON.parse(devicedata);
                let storedmac = profile.mac;
                let storedAccount = profile.accounts; //array of reserved accounts

                let accountdom = ``;
                for(let i=0; i < storedAccount.length; i++){
                    accountdom +=`
                        <p>${storedAccount[i].account_number}</p>
                        <p>${storedAccount[i].account_name}</p>
                        <p>${storedAccount[i].bank.name}</p>
                        <hr/>
                    `;
                }

                //check whether his mac is same as the one stored
                if(mac === storedmac){
                    //just fetch the particular plan he seleted and show him to pay to one of the stored accounts
                    let planApi = fetch('http://192.168.200.1:8080/newdichlan/ansofra/api/geteachplans', {
                        method:"POST",
                        headers:{
                            'Content-Type':'application/json'
                        },
                        body:JSON.stringify({plans_id:plans_id})
                    });
                    let planRes = await planApi.json();
                    if(planRes.status ==="success"){
                        let planResponse = planRes.response[0];
                        let out = `
                            <div>
                                Plan : <strong>${planResponse.plan}</strong> <br/>
                                Price : <strong>${planResponse.currency} ${planResponse.discount !=='' && planResponse.price >= planResponse.discount ? parseFloat(planResponse.price) - parseFloat(planResponse.discount) : planResponse.price}</strong> <br/>
                                Make payment into any of these accounts below:<br/>
                        `;
                        out += accountdom;
                        out +=`
                            </div>
                        `;
                        document.getElementById("plan-list").innerHTM=out;
                        return;
                    }
                    else{
                        alert(`${planRes.response}`);
                        window.location.href="http://192.168.200.1:8080/newdichlan/ansofra/pay";
                        return;
                    }

                            },

                        });

                        if(planRes.status ==="success"){

                            let out = `

                                    Make payment into any of these accounts below:<br/>
                            `;
                            out += accountdomNewMAc;
                            out +=`
                                </div>
                            `;
                            document.getElementById("plan-list").innerHTM=out;
                            return;
                        }
                        else{
                            alert(`${planRes.response}`);
                            window.location.href="http://192.168.200.1:8080/newdichlan/ansofra/pay";
                            return;
                        }

                    else{

                            let planRes = await planApi.json();
                            if(planRes.status ==="success"){

                                return;
                            }
                            else{
                                alert(`${planRes.response}`);
                                window.location.href="http://192.168.200.1:8080/newdichlan/ansofra/pay";
                                return;
                            }
                        }
                        else{
                            alert(`${loginRes.response}`);
                            window.location.href="http://192.168.200.1:8080/newdichlan/ansofra/pay";
                            return;
                        }
                    }

                    //END COPY HERE
                }
            }
            else{

                //then it means it's another device, register or fetch it
                    //check if he has registered or not
                    let apiNewMAc = await fetch('http://192.168.200.1:8080/newdichlan/ansofra/api/register', {
                        method:"POST",
                        headers:{
                            'Content-Type' : 'application/json'
                        },
                        body:JSON.stringify(body)

                    let resNewMAc = await apiNewMAc.json();
                    if(resNewMAc.status ==="success"){
                        //registration was successful
                        //it will return the reserved account numbers
                        //store it in the browser localstorage
                        let resNewMAcResponse = resNewMAc.response;
                        let devicedataNewMac = {
                            mac:mac,
                            accounts:resNewMAcResponse
                        };
                        localStorage.setItem("devicedata", JSON.stringify(devicedataNewMac));

                        //loop it
                        let accountdomNewMAc = ``;
                        for(let i=0; i < resNewMAcResponse.length; i++){
                            accountdomNewMAc +=`
                                <p>${resNewMAcResponse[i].account_number}</p>
                                <p>${resNewMAcResponse[i].account_name}</p>
                                <p>${resNewMAcResponse[i].bank.name}</p>
                                <hr/>
                            `;
                        }

                        //now fetch the plan he requested for
                        let planApi = fetch('http://192.168.200.1:8080/newdichlan/ansofra/api/geteachplans', {
                            method:"POST",
                            headers:{
                                'Content-Type':'application/json'
                            },
                            body:JSON.stringify({plans_id:plans_id})
                        });
                        let planRes = await planApi.json();
                        if(planRes.status ==="success"){
                            let planResponse = planRes.response[0];
                            let out = `
                                <div>
                                    Plan : <strong>${planResponse.plan}</strong> <br/>
                                    Price : <strong>${planResponse.currency} ${planResponse.discount !=='' && planResponse.price >= planResponse.discount ? parseFloat(planResponse.price) - parseFloat(planResponse.discount) : planResponse.price}</strong> <br/>
                                    Make payment into any of these accounts below:<br/>
                            `;
                            out += accountdomNewMAc;
                            out +=`
                                </div>
                            `;
                            document.getElementById("plan-list").innerHTM=out;
                            return;
                        }
                        else{
                            alert(`${planRes.response}`);
                            window.location.href="http://192.168.200.1:8080/newdichlan/ansofra/pay";
                            return;
                        }
                    }
                    else{
                        //he probably have registered before, try to fetch his reserved account data
                        let loginApi = await fetch('http://192.168.200.1:8080/newdichlan/ansofra/api/getreserved', {
                            method:"POST",
                            headers:{
                                'Content-Type':'application/json'
                            },
                            body:JSON.stringify({mac:mac})
                        });
                        
                        let loginRes = await loginApi.json();
                        if(loginRes.status ==="success"){
                            let loginResResponse = loginRes.response;
                            let devicedataNewMac = {
                                mac:mac,
                                accounts:loginResResponse
                            };
                            localStorage.setItem("devicedata", JSON.stringify(devicedataNewMac));

                            //loop it
                            let accountdomNewMAc = ``;
                            for(let i=0; i < loginResResponse.length; i++){
                                accountdomNewMAc +=`
                                    <p>${loginResResponse[i].account_number}</p>
                                    <p>${loginResResponse[i].account_name}</p>
                                    <p>${loginResResponse[i].bank.name}</p>
                                    <hr/>
                                `;
                            }

                            //now fetch the plan he requested for
                            let planApi = fetch('http://192.168.200.1:8080/newdichlan/ansofra/api/geteachplans', {
                                method:"POST",
                                headers:{
                                    'Content-Type':'application/json'
                                },
                                body:JSON.stringify({plans_id:plans_id})
                            });
                            let planRes = await planApi.json();
                            if(planRes.status ==="success"){
                                let planResponse = planRes.response[0];
                                let out = `
                                    <div>
                                        Plan : <strong>${planResponse.plan}</strong> <br/>
                                        Price : <strong>${planResponse.currency} ${planResponse.discount !=='' && planResponse.price >= planResponse.discount ? parseFloat(planResponse.price) - parseFloat(planResponse.discount) : planResponse.price}</strong> <br/>
                                        Make payment into any of these accounts below:<br/>
                                `;
                                out += accountdomNewMAc;
                                out +=`
                                    </div>
                                `;
                                document.getElementById("plan-list").innerHTM=out;
                                return;
                            }
                            else{
                                alert(`${planRes.response}`);
                                window.location.href="http://192.168.200.1:8080/newdichlan/ansofra/pay";
                                return;
                            }
                        }
                        else{
                            alert(`${loginRes.response}`);
                            window.location.href="http://192.168.200.1:8080/newdichlan/ansofra/pay";

    </script>
